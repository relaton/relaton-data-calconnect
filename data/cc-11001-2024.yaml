abstract:
- content: |
    <p>The Internet Calendaring and Scheduling Core Object Specification (iCalendar) (RFC5545) VTODO calendar component has seen limited adoption and use, mainly for personal reminders and to-do lists.</p>

    <p>This document updates and defines extensions to VTODO to provide improved status tracking, scheduling and specification of tasks to allow its use in other contexts, such as process control and project management.</p>

    <p>It also defines how Calendaring Extensions to WebDAV (CalDAV) (RFC 4791) servers can be extended to support certain automated task management behaviours.</p>

    <p>The Calendaring and Scheduling Consortium ("<tt>CalConnect</tt>") is a global non-profit organization with the aim to facilitate interoperability of collaborative technologies and tools through open standards.</p>

    <p>CalConnect works closely with international and regional partners, of which the full list is available on our website ().</p>

