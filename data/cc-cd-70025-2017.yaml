abstract:
- content: |
    <p>This specification defines a framework and protocols for a push notification system that allows clients, application servers and push notification servers to interact with each other in a standardized manner.</p>

    <p>The Calendaring and Scheduling Consortium ("<tt>CalConnect</tt>") is a global non-profit organization with the aim to facilitate interoperability of collaborative technologies and tools through open standards.</p>

    <p>CalConnect works closely with international and regional partners, of which the full list is available on our website ().</p>

    <p>The procedures used to develop this document and those intended for its further maintenance are described in the CalConnect Directives.</p>

    <p>In particular the different approval criteria needed for the different types of CalConnect documents should be noted. This document was drafted in accordance with the editorial rules of the CalConnect Directives.</p>

