abstract:
- content: |
    <p>This specification updates <eref type="inline" bibitemid="RFC5545" citeas="IETF&#xA0;RFC&#xA0;5545"/> by introducing a number of new iCalendar properties and components which are of particular use for event publishers and in social networking.</p>

    <p>This specification also defines a new STRUCTURED-DATA property for iCalendar <eref type="inline" bibitemid="RFC5545" citeas="IETF&#xA0;RFC&#xA0;5545"/> to allow for data that is directly pertinent to an event or task to be included with the calendar data.</p>
